<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>3D Brand Sites — Demos</title>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,400;1,300&family=Inter:wght@400;600&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; margin: 0; }
    body { min-height: 100vh; background: #14110e; color: #f4ead9; font-family: Inter, sans-serif; padding: 64px 16px; }
    main { max-width: 960px; margin: 0 auto; }
    h1 { font-family: Fraunces, serif; font-weight: 400; font-size: clamp(40px, 7vw, 72px); letter-spacing: -.03em; line-height: 1; }
    h1 em { font-weight: 300; color: #e0a526; }
    p.sub { margin: 16px 0 40px; color: rgba(244, 234, 217, .6); }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 18px; }
    a { display: block; padding: 32px 28px; border-radius: 24px; text-decoration: none; color: inherit; transition: transform .25s; }
    a:hover { transform: translateY(-4px); }
    a b { display: block; font-size: 34px; letter-spacing: -.02em; }
    a span { display: block; margin-top: 8px; font-size: 15px; opacity: .8; }
    .kadak { background: #a8432a; }
    .hapus { background: #f7a21b; color: #1f2a14; }
  </style>
</head>
<body>
  <main>
    <h1>3D brand sites <em>for Indian D2C.</em></h1>
    <p class="sub">Concept demos · fictional brands · scroll to play</p>
    <div class="grid">
      <a class="kadak" href="kadak/"><b>KADAK</b><span>Chai, reimagined. A kulhad cracks open, the can rises, five flavours.</span></a>
      <a class="hapus" href="hapus/"><b>HAPUS</b><span>The King, bottled. An Alphonso splits, the bottle rises, harvest countdown.</span></a>
    </div>
  </main>
</body>
</html>
